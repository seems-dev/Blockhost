name: CD — Deploy to AWS

on:
  push:
    branches: [main, master]
  workflow_dispatch: # allow manual trigger from GitHub UI

# ---------------------------------------------------------------------------
# Required GitHub Secrets (set these in your repo Settings → Secrets):
#
#   CONTROL_PLANE_HOST    — Public IP of your Control Plane EC2
#   CONTROL_PLANE_SSH_KEY — Private SSH key for the control plane EC2
#   AGENT_HOST_1          — Public IP of your Agent Node EC2
#   AGENT_SSH_KEY         — Private SSH key for the agent EC2(s)
#   AGENT_TOKEN           — Shared secret token (must match WORKER_AGENT_TOKEN in control plane .env)
# ---------------------------------------------------------------------------

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Run tests first — never deploy broken code
  # ---------------------------------------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blockhost
          POSTGRES_PASSWORD: test
          POSTGRES_DB: blockhost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blockhost -d blockhost_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://blockhost:test@localhost:5432/blockhost_test
      PRODUCTION_MODE: "false"
      JWT_SECRET_KEY: test-jwt-secret-key-for-ci-only-32chars
      WORKER_AGENT_TOKEN: test-worker-agent-token-for-ci-only-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest tests/ -q --tb=short

  # ---------------------------------------------------------------------------
  # Job 2: Build & deploy the Admin Dashboard (React + Vite → S3 + CloudFront)
  # ---------------------------------------------------------------------------
  deploy-admin:
    name: Deploy Admin Dashboard
    needs: test
    runs-on: ubuntu-latest
    # OPTIONAL: Only enable if you set up S3. Comment out the 'if' to disable.
    # if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: blockhost-admin/package-lock.json

      - name: Install dependencies
        working-directory: blockhost-admin
        run: npm ci

      - name: Build admin dashboard
        working-directory: blockhost-admin
        env:
          # The URL of your API — used by the React app to make API calls
          VITE_API_BASE_URL: https://${{ secrets.CONTROL_PLANE_HOST }}
        run: npm run build

      # Uncomment and fill in when you have S3 set up:
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: ap-south-1

      # - name: Deploy to S3
      #   run: aws s3 sync blockhost-admin/dist/ s3://${{ secrets.ADMIN_S3_BUCKET }}/ --delete

      # - name: Invalidate CloudFront
      #   run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} --paths "/*"

      - name: Upload build artifact (fallback — manual deploy)
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: blockhost-admin/dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3: Deploy the Control Plane (API + Worker) to its EC2 via SSH
  # ---------------------------------------------------------------------------
  deploy-control-plane:
    name: Deploy Control Plane
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Control Plane EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CONTROL_PLANE_HOST }}
          username: ubuntu
          key: ${{ secrets.CONTROL_PLANE_SSH_KEY }}
          # These commands run ON the Control Plane EC2
          script: |
            set -euo pipefail
            echo "=== Pulling latest code ==="
            cd /opt/blockhost
            git pull origin main

            echo "=== Rebuilding and restarting Docker containers ==="
            cd /opt/blockhost/deploy
            docker compose -f docker-compose.prod.yml build --pull
            docker compose -f docker-compose.prod.yml up -d

            echo "=== Running DB migrations ==="
            docker compose -f docker-compose.prod.yml exec -T api alembic upgrade head

            echo "=== Health check ==="
            sleep 5
            curl -sf http://localhost/ping && echo "API is healthy ✅" || echo "WARNING: /ping check failed"

  # ---------------------------------------------------------------------------
  # Job 4: Deploy the Agent to each Agent Node EC2 via SSH
  # Add more jobs like this for each agent node you add.
  # ---------------------------------------------------------------------------
  deploy-agent-node-1:
    name: Deploy Agent Node 1
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Agent to Node 1 EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AGENT_HOST_1 }}
          username: ubuntu
          key: ${{ secrets.AGENT_SSH_KEY }}
          # These commands run ON the Agent EC2
          script: |
            set -euo pipefail
            echo "=== Pulling latest code ==="
            cd /opt/blockhost
            git pull origin main

            echo "=== Installing/updating Python dependencies ==="
            cd /opt/blockhost
            pip install -e . --quiet

            echo "=== Restarting blockhost-agent service ==="
            sudo systemctl restart blockhost-agent

            echo "=== Health check ==="
            sleep 3
            curl -sf http://localhost:9000/agent/health && echo "Agent is healthy ✅" || echo "WARNING: Agent health check failed"
