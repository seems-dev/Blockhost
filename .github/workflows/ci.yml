name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blockhost
          POSTGRES_PASSWORD: test
          POSTGRES_DB: blockhost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blockhost -d blockhost_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://blockhost:test@localhost:5432/blockhost_test
      PRODUCTION_MODE: "false"
      JWT_SECRET_KEY: test-jwt-secret-key-for-ci-only-32chars
      WORKER_AGENT_TOKEN: test-worker-agent-token-for-ci-only-32

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run tests
        run: pytest tests/ -q --tb=short

      - name: Flutter analyze (optional)
        continue-on-error: true
        working-directory: flutter_client
        run: |
          if command -v flutter >/dev/null 2>&1; then
            flutter pub get
            flutter analyze
          else
            echo "Flutter not installed on runner — skipping"
          fi
