# Proxy stack: runs on a dedicated tiny VM (e.g., t3.nano).
# Routes player TCP/UDP traffic to the correct backend node.
#
# Usage:
#   docker compose -f docker-compose.proxy.yml up -d
#
# The proxy reads routing from the same Postgres database as the control plane.
# Set DATABASE_URL in .env to point to the control plane's Postgres.

services:
  proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    command: blockhost-proxy
    env_file:
      - .env
    environment:
      PROXY_ENABLED: "true"
    ports:
      # Proxy port range — players connect here
      - "30000-30100:30000-30100/tcp"
      - "30000-30100:30000-30100/udp"
    # Note: Expand the port range above as you add more servers.
    # Docker limits the number of ports in a range mapping, so start
    # small and expand as needed (or use --network host for unlimited).
