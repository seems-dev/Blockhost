services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://blockhost:blockhost@db:5432/blockhost
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me-in-prod
      JWT_ACCESS_TOKEN_EXPIRE_SECONDS: "86400"
      JWT_REFRESH_TOKEN_EXPIRE_SECONDS: "2592000"
      MINECRAFT_PUBLIC_HOST: 192.168.29.102
      MINECRAFT_PORT: "19132"
      WORKER_AGENT_URL: http://worker:9000
      WORKER_AGENT_TOKEN: change-me-in-dev
    depends_on:
      - db
      - redis
      - worker

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      WORKER_AGENT_TOKEN: change-me-in-dev
      # Host port range for per-server Bedrock containers (19132/udp inside container).
      MINECRAFT_DYNAMIC_PORT_START: "20000"
      MINECRAFT_DYNAMIC_PORT_END: "20100"
      # Docker network to use for Bedrock containers. When worker is on compose network,
      # bedrock containers should join the same network for service-to-service communication.
      DOCKER_NETWORK: blockhost_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # No published ports needed; API talks to `worker:9000` on the compose network.

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blockhost
      POSTGRES_USER: blockhost
      POSTGRES_PASSWORD: blockhost
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # No host port published by default (API talks to `redis:6379` on the compose network)

volumes:
  pgdata:
