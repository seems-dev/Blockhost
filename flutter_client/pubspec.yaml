name: erex_client
description: Minimal client to test Erex backend
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.2.3
  google_sign_in: ^6.1.2
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.3
  file_picker: ^11.0.2
  audioplayers: ^6.7.1
  intl: ^0.19.0
  flutter_markdown: ^0.7.7+1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/screen.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/audio/
