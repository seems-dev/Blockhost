[project]
name = "blockhost-backend"
version = "0.1.0"
description = "Minecraft Bedrock server orchestration for mobile"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "b2sdk>=2.0.0",
    "stripe>=10.0.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.0.0",
    "websockets>=12.0",
    "alembic>=1.18.4",
    "pwdlib[argon2]>=0.3.0",
    "razorpay>=2.0.1",
    "psutil>=7.2.2",
    "google-auth>=2.36.0",
]

[project.scripts]
blockhost-worker = "blockhost_backend.worker:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
